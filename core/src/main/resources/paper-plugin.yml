name: RavenSpawners
version: '${version}'
main: github.nighter.ravenspawners.RavenSpawners
api-version: '1.21'
description: "A GUI-based spawner plugin that generates items and experience without spawning mobs"
authors: [ https://github.com/OpenVdra/RavenSpawners ]
website: "https://openvdra.github.io/RavenSpawners/"
folia-supported: true

# Load order - POSTWORLD means after all worlds are loaded
load: POSTWORLD

# Prefix for logging messages
prefix: "RavenSpawners"

# Dependencies
dependencies:
  server:
    # Bedrock Support Plugins
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
    Geyser-Spigot:
      load: BEFORE
      required: false
      join-classpath: true
    # Shop Plugins
    EconomyShopGUI:
      load: AFTER
      required: false
      join-classpath: true
    EconomyShopGUI-Premium:
      load: AFTER
      required: false
      join-classpath: true
    ShopGUIPlus:
      load: BEFORE
      required: false
      join-classpath: true
    zShop:
      load: BEFORE
      required: false
      join-classpath: true
    RavenSell:
      load: BEFORE
      required: false
      join-classpath: true

    # Economy Plugins
    ExcellentEconomy:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true

    # Protection/Region Plugins
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
    Lands:
      load: BEFORE
      required: false
      join-classpath: true
    Towny:
      load: BEFORE
      required: false
      join-classpath: true
    SimpleClaimSystem:
      load: BEFORE
      required: false
      join-classpath: true
    RedProtect:
      load: BEFORE
      required: false
      join-classpath: true
    minePlots:
      load: BEFORE
      required: false
      join-classpath: true
    Residence:
      load: BEFORE
      required: false
      join-classpath: true
    # World Management Plugins
    Multiverse-Core:
      load: BEFORE
      required: false
      join-classpath: true
    MultiWorld:
      load: BEFORE
      required: false
      join-classpath: true
    Worlds:
      load: BEFORE
      required: false
      join-classpath: true
    SuperiorSkyblock2:
      load: BEFORE
      required: false
      join-classpath: true
    BentoBox:
      load: BEFORE
      required: false
      join-classpath: true
    IridiumSkyblock:
      load: BEFORE
      required: false
      join-classpath: true
    PlotSquared:
      load: BEFORE
      required: false
      join-classpath: true

    # RPG/Skill Plugins
    AuraSkills:
      load: BEFORE
      required: false
      join-classpath: true

    # Drops Plugins
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true

# Permissions
permissions:
  # Main command permission
  ravenspawners.command.use:
    description: "Allow access to RavenSpawners commands"
    default: op

  # Subcommand permissions
  ravenspawners.command.reload:
    description: "Permission to reload RavenSpawners plugin"
    default: op

  ravenspawners.command.give:
    description: "Allow giving spawners to yourself"
    default: op

  ravenspawners.command.list:
    description: "Allow viewing list of spawners and teleporting to them"
    default: op

  ravenspawners.command.hologram:
    description: "Allow toggling hologram for spawners"
    default: op

  ravenspawners.command.prices:
    description: "Allow viewing sell prices of spawner items"
    default: op

  ravenspawners.command.clear:
    description: "Allow clearing holograms and ghost spawners"
    default: op

  ravenspawners.command.near:
    description: "Allow highlighting nearby spawners through walls"
    default: op

  ravenspawners.command.set:
    description: "Allow setting RavenSpawners stack size, range, and delay"
    default: op

  ravenspawners.command.language:
    description: "Allow changing the active RavenSpawners language"
    default: op

  ravenspawners.command.gui_layout:
    description: "Allow changing the active RavenSpawners GUI layout"
    default: op

  # Feature permissions
  ravenspawners.changetype:
    description: "Allow changing spawner type with spawn egg"
    default: op

  ravenspawners.stack:
    description: "Allow stacking spawners"
    default: true

  ravenspawners.break:
    description: "Allow breaking spawners"
    default: true

  ravenspawners.break.bypassdropchance:
    description: "Bypass spawner drop chance and always receive spawner drops"
    default: op

  ravenspawners.sellall:
    description: "Allow selling items in spawner storage GUI"
    default: true
