name: RavenSpawners
version: '${version}'
main: github.nighter.ravenspawners.RavenSpawners
api-version: '1.21'
authors: [ https://github.com/Ravenmc-live/RavenSpawner ]
folia-supported: true
softdepend:
  # Bedrock Support Plugins
  - floodgate
  - Geyser-Spigot

  # Shop Plugins
  - EconomyShopGUI
  - EconomyShopGUI-Premium
  - ShopGUIPlus
  - zShop

  # Utility/Economy Plugins
  - ExcellentEconomy
  - Vault

  # Protection/Region Plugins
  - WorldGuard
  - GriefPrevention
  - Lands
  - Towny
  - SimpleClaimSystem
  - RedProtect
  - minePlots
  - PlotSquared
  - Residence
  - FactionsUUID
  - BlockLocker

  # World Management Plugins
  - Multiverse-Core
  - MultiWorld
  - Worlds
  - SuperiorSkyblock2
  - BentoBox
  - IridiumSkyblock

  # RPG/Skill Plugins
  - AuraSkills

  #Drops Plugins
  - MythicMobs

commands:
  ravenspawners:
    description: Main command for RavenSpawners plugin
    usage: /ravenspawners [reload|give|list|hologram|prices|clear|near|set|language|gui_layout] [args...]
    aliases: [ ss, spawner ]
    permission: ravenspawners.command.use
    permission-message: "You don't have permission to use RavenSpawners commands!"

permissions:
  # Main command permission
  ravenspawners.command.use:
    description: Allow access to RavenSpawners commands
    default: op

  # Subcommand permissions
  ravenspawners.command.reload:
    description: Permission to reload RavenSpawners plugin
    default: op

  ravenspawners.command.give:
    description: Allow giving spawners to yourself
    default: op

  ravenspawners.command.list:
    description: Allow viewing list of spawners and teleporting to them
    default: op

  ravenspawners.command.hologram:
    description: Allow toggling hologram for spawners
    default: op

  ravenspawners.command.prices:
    description: Allow viewing sell prices of spawner items
    default: op

  ravenspawners.command.clear:
    description: Allow clearing holograms and ghost spawners
    default: op

  ravenspawners.command.near:
    description: Allow highlighting nearby spawners through walls
    default: op

  ravenspawners.command.set:
    description: Allow setting RavenSpawners stack size, range, and delay
    default: op

  ravenspawners.command.language:
    description: Allow changing the active RavenSpawners language
    default: op

  ravenspawners.command.gui_layout:
    description: Allow changing the active RavenSpawners GUI layout
    default: op

  # Feature permissions
  ravenspawners.changetype:
    description: Allow changing spawner type with spawn egg
    default: op

  ravenspawners.stack:
    description: Allow stacking spawners
    default: true

  ravenspawners.break:
    description: Allow breaking spawners
    default: true

  ravenspawners.break.bypassdropchance:
    description: Bypass spawner drop chance and always receive spawner drops
    default: op

  ravenspawners.sellall:
    description: Allow selling items in spawner storage GUI
    default: true
