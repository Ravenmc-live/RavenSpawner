slot_1:
  material: ARROW
  enabled: true
  click:
    action: previous_page
    sound: ui.button.click
slot_2:
  material: RED_STAINED_GLASS_PANE
  enabled: true
  click:
    action: return_main
    sound: ui.button.click
slot_3:
  material: CHEST
  enabled: true
  click:
    action: take_all
    sound: ui.button.click
slot_4:
  material: DROPPER
  enabled: true
  click:
    action: drop_page
    sound: ui.button.click
slot_5:
  material: GOLD_INGOT
  enabled: true
  if:
    sell_integration:
      click:
        action: sell_all
        sound: ui.button.click
        sound_success: entity.experience_orb.pickup
        sound_fail: entity.villager.no
    no_sell_integration:
      material: EXPERIENCE_BOTTLE
      click:
        action: collect_exp
        sound_success: entity.experience_orb.pickup
        sound_fail: entity.villager.no
slot_6:
  material: COMPARATOR
  enabled: true
  click:
    action: open_filter
    sound: ui.button.click
slot_7:
  material: CAULDRON
  enabled: true
  click:
    action: sort_items
    sound: ui.button.click
slot_8:
  material: HOPPER
  enabled: true
  click:
    action: cycle_storage_filter
    sound: ui.button.click
slot_9:
  material: ARROW
  enabled: true
  click:
    action: next_page
    sound: ui.button.click
