skip_main_gui: false
open_sound: ui.button.click
slot_12:
  material: CHEST
  enabled: true
  click:
    action: open_storage
    sound: ui.button.click
slot_14:
  material: PLAYER_HEAD
  enabled: true
  info_button: true
  if:
    sell_integration:
      left_click:
        action: sell_and_exp
        sound: ui.button.click
        sound_success: entity.experience_orb.pickup
        sound_fail: entity.villager.no
      right_click:
        action: open_stacker
        sound: ui.button.click
    no_sell_integration:
      click:
        action: open_stacker
        sound: ui.button.click
slot_16:
  material: EXPERIENCE_BOTTLE
  enabled: true
  click:
    action: collect_exp
    sound_success: entity.experience_orb.pickup
    sound_fail: entity.villager.no
